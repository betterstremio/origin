// Stremio Origin for Android. The native libraries (libmain.so, libSDL2.so, libcurl.so, libsbengine.so), SDL's Java
// sources and the app's assets are put in place by tools/android/build-apk.sh; this file only packages them.
plugins { id 'com.android.application' }

def appVersion = new groovy.json.JsonSlurper().parse(file(System.getenv('SB_APPINFO'))).version as String
def vp = appVersion.tokenize('.').collect { it as int }
def ks = System.getenv('SB_KEYSTORE')
def abis = (System.getenv('SB_ABIS') ?: 'arm64-v8a armeabi-v7a').tokenize(' ')

android {
    namespace 'tv.stremioorigin.app'
    compileSdk 35
    defaultConfig {
        applicationId 'tv.stremioorigin.app'
        minSdk 24
        targetSdk 35
        versionName appVersion
        versionCode vp[0] * 10000 + vp[1] * 100 + vp[2]
        // dev builds (-Pdev) take SB_* settings from the launch intent: the automated tests drive the app that way
        buildConfigField 'boolean', 'DEV_HOOKS', (project.hasProperty('dev') ? 'true' : 'false')
        if (project.hasProperty('dev')) ndk { abiFilters(*abis) }
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SB_KEYSTORE_PASS')
                keyAlias 'stremioorigin'
                keyPassword System.getenv('SB_KEYSTORE_PASS')
            }
        }
    }
    // release: one APK per CPU type, plus the universal one, the only file that installed 2.1.2 and older apps recognise
    splits { abi { enable !project.hasProperty('dev'); reset(); include(*abis); universalApk true } }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable project.hasProperty('dev')   // dev builds: run-as works (the tests keep and restore the test account's session)
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { jniLibs { useLegacyPackaging true } }   // extracted to nativeLibraryDir: the engine is opened by path
    sourceSets { main { java.srcDirs += ['build/sdl-java'] } }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    def m3 = '1.5.0'
    implementation "androidx.media3:media3-exoplayer:$m3"
    implementation "androidx.media3:media3-exoplayer-hls:$m3"
    implementation "androidx.media3:media3-exoplayer-dash:$m3"
    implementation "androidx.media3:media3-ui:$m3"
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
}
